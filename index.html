
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squishe Luxury</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8fb;color:#493b42;font-family:Arial,sans-serif}
header{background:#f7c9dc;padding:22px;text-align:center}
header h1{margin:0;color:#914366}
header p{margin:6px 0 0}
main{max-width:1100px;margin:auto;padding:22px}
.hero{text-align:center;background:#ffe8f1;padding:35px 15px;border-radius:22px}
.hero h2{font-size:32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{background:white;border:1px solid #f1d8e3;border-radius:18px;padding:12px;text-align:center}
.product img,.emoji{width:100%;height:145px;object-fit:contain;border-radius:12px;background:#fff0f5}
.emoji{display:grid;place-items:center;font-size:65px}
.price{color:#b95782;font-weight:bold}
button{background:#b95782;color:white;border:0;border-radius:20px;padding:11px 16px;cursor:pointer}
#basket{background:white;padding:18px;margin-top:25px;border-radius:18px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<h1>✨ Squishe Luxury ✨</h1>
<p>Super-soft things, happy days!</p>
</header>
<main>
<section class="hero">
<h2>Find your happy squish!</h2>
<p>Choose your favourite squishies. Only £2 each!</p>
</section>

<h2>Our Squishies 💗</h2>
<div class="grid" id="products"></div>

<section id="basket">
<h2>Your Basket 🛍️</h2>
<div id="basketItems">Your basket is empty.</div>
<h3 id="total">Total: £0.00</h3>
<button onclick="clearBasket()">Clear basket</button>
</section>

<section id="checkout">
<h2>Checkout</h2>
<p>This is a demo checkout. It does not take payments or create real orders.</p>
</section>
</main>

<script>
const products=[
["Butter Squishy","🧈","IMG_2778.jpeg"],
["Strawberry Squishy","🍓","IMG_2779.jpeg"],
["Peach Squishy","🍑","IMG_2780.jpeg"],
["Axolotl Squishy","🩷","IMG_2781.jpeg"],
["Bunny Squishy","🐰","IMG_2782.jpeg"],
["Cloud Squishy","☁️","IMG_2783.jpeg"],
["Donut Squishy","🍩","IMG_2784.jpeg"],
["Bread Squishy","🍞","IMG_2785.jpeg"],
["Heart Squishy","💗","IMG_2786.jpeg"],
["Cat Paw Squishy","🐾","IMG_2787.jpeg"],
["Bear Squishy","🧸","IMG_2788.jpeg"],
["Watermelon Squishy","🍉","IMG_2789.jpeg"]
];

let basket={};

function showProducts(){
 const root=document.getElementById("products");
 products.forEach((p,i)=>{
  const card=document.createElement("article");
  card.className="product";
  const img=document.createElement("img");
  img.src=p[2];
  img.alt=p[0];
  img.onerror=()=>{img.replaceWith(Object.assign(document.createElement("div"),{className:"emoji",textContent:p[1]}) )};
  const title=document.createElement("h3");
  title.textContent=p[0];
  const price=document.createElement("p");
  price.className="price";
  price.textContent="£2.00";
  const button=document.createElement("button");
  button.textContent="Add to basket";
  button.onclick=()=>{basket[i]=(basket[i]||0)+1;showBasket()};
  card.append(img,title,price,button);
  root.appendChild(card);
 });
}

function showBasket(){
 const root=document.getElementById("basketItems");
 root.innerHTML="";
 let total=0;
 Object.keys(basket).forEach(k=>{
  const i=Number(k),q=basket[k];
  total+=q*2;
  const line=document.createElement("p");
  line.textContent=products[i][0]+" × "+q;
  root.appendChild(line);
 });
 if(total===0)root.textContent="Your basket is empty.";
 document.getElementById("total").textContent="Total: £"+total.toFixed(2);
}
function clearBasket(){basket={};showBasket()}
showProducts();
showBasket();
</script>
<footer style="text-align:center;padding:25px">© Squishe Luxury</footer>
</body>
</html>
